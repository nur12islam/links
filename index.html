<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0709">
<meta name="description" content="DARKI Links — apps, tools, shops and sites built by DARKI, in one place.">
<title>DARKI Links</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ff2d55'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3ED%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0709;--ink:#f6eff1;--mute:#a3979b;--dim:#70656a;--line:rgba(255,255,255,.09);--glass:rgba(255,255,255,.045);--red:#ff2d55;--red2:#c4143c;--glow:rgba(255,45,85,.35)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 Manrope,system-ui,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(120px)}
.bg i:nth-child(1){width:560px;height:560px;left:-150px;top:-190px;background:rgba(255,45,85,.27)}
.bg i:nth-child(2){width:480px;height:480px;right:-170px;top:32%;background:rgba(130,20,70,.34)}
.bg:after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.3;mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 70%)}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:24px 0}
.logo{display:flex;align-items:center;gap:12px;font:500 15px Unbounded,sans-serif;letter-spacing:-.01em}
.mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font:600 16px Unbounded,sans-serif;background:linear-gradient(145deg,var(--red),var(--red2));box-shadow:0 8px 24px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.hint{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--glass);color:var(--mute);font-size:13px;cursor:pointer;transition:border-color .2s}
.hint:hover{border-color:rgba(255,45,85,.5)}
kbd{font:600 11px Manrope,sans-serif;padding:3px 7px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--mute)}
.hero{padding:64px 0 8px}
h1{font:500 clamp(38px,6.6vw,78px)/1.05 Unbounded,sans-serif;letter-spacing:-.045em}
.ln{display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
.ln span{display:block;animation:up .9s cubic-bezier(.2,.8,.2,1) backwards}
.ln:nth-child(2) span{animation-delay:.12s;color:var(--mute)}
.lede{margin-top:20px;max-width:46ch;color:var(--mute);font-size:16px}
.search{margin-top:34px;display:flex;align-items:center;gap:12px;padding:4px 10px 4px 18px;border:1px solid var(--line);border-radius:16px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:rgba(255,45,85,.6);box-shadow:0 0 0 4px rgba(255,45,85,.1),0 10px 40px rgba(255,45,85,.12)}
.search svg{flex:none;color:var(--mute)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;padding:15px 0;font-size:16px}
.search input::placeholder{color:var(--dim)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 28px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border:1px solid var(--line);border-radius:99px;background:var(--glass);color:var(--mute);font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.chip small{font-size:11px;opacity:.65}
.chip:hover{color:var(--ink);border-color:rgba(255,255,255,.22)}
.chip[aria-pressed=true]{background:var(--ink);color:#1a0d11;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;perspective:1200px}
.card{position:relative;display:flex;flex-direction:column;min-height:206px;padding:22px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.02));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,border-color .25s;animation:in .6s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i) * 60ms + 350ms)}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(340px circle at var(--mx,50%) var(--my,0%),rgba(255,45,85,.22),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover{border-color:rgba(255,45,85,.5)}
.card:hover:before{opacity:1}
.card.wide{grid-column:span 2}
.card[hidden]{display:none}
.row{display:flex;justify-content:space-between;align-items:flex-start}
.icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font:500 14px Unbounded,sans-serif;background:linear-gradient(145deg,rgba(255,45,85,.3),rgba(255,45,85,.06));border:1px solid rgba(255,45,85,.4);color:#ffd6de}
.acts{position:relative;z-index:2;display:flex;align-items:center;gap:4px;color:var(--dim)}
.copy{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:10px;background:none;color:inherit;cursor:pointer;transition:.2s}
.copy:hover{background:rgba(255,255,255,.08);color:var(--ink)}
.arr{display:grid;place-items:center;width:34px;height:34px;transition:.25s}
.card:hover .arr{color:var(--red);transform:translate(2px,-2px)}
h3{margin-top:22px;font:500 19px Unbounded,sans-serif;letter-spacing:-.03em}
.desc{margin-top:8px;max-width:40ch;color:var(--mute);font-size:14px}
.meta{margin-top:auto;padding-top:20px;display:flex;justify-content:space-between;gap:10px;color:var(--dim);font-size:12.5px}
.go{position:absolute;inset:0;z-index:1;border-radius:inherit}
.go:focus-visible,.chip:focus-visible,.copy:focus-visible,.hint:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.empty{display:none;text-align:center;padding:48px 20px;border:1px dashed var(--line);border-radius:22px;color:var(--mute)}
.empty button{margin-top:12px;padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:var(--glass);cursor:pointer}
.foot{margin-top:72px;padding:24px 0 36px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--dim);font-size:13px}
.foot a{color:var(--mute)}.foot a:hover{color:var(--red)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);padding:11px 18px;border-radius:12px;background:#1c1014;border:1px solid rgba(255,45,85,.45);font-size:13px;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes up{from{transform:translateY(105%)}}
@keyframes in{from{opacity:0;transform:translateY(18px)}}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card.wide{grid-column:auto}}
@media(max-width:600px){.wrap{width:calc(100% - 28px)}.hero{padding-top:40px}.grid{grid-template-columns:1fr}.card{min-height:0}.hint{display:none}.chips{flex-wrap:nowrap;overflow-x:auto;margin-inline:-14px;padding-inline:14px;scrollbar-width:none}.chip{flex:none}.search kbd{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.card{transform:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i></div>
<div class="wrap">
<header class="top">
<a class="logo" href="./" aria-label="DARKI Links home"><span class="mark">D</span>DARKI Links</a>
<button class="hint" id="hint" type="button">Search <kbd>Ctrl K</kbd></button>
</header>
<main>
<section class="hero">
<h1><span class="ln"><span>All my work,</span></span><span class="ln"><span>one tap away.</span></span></h1>
<p class="lede">Apps, tools, shops and sites I've built. Search, filter, or just pick one.</p>
<label class="search">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
<input id="q" type="search" placeholder="Search by name, topic or domain" autocomplete="off" aria-label="Search links">
<kbd>/</kbd>
</label>
<div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
</section>
<section aria-label="Links">
<div class="grid" id="grid"></div>
<div class="empty" id="empty"><p>No links match your search.</p><button type="button" id="reset">Clear search</button></div>
</section>
</main>
<footer class="foot">
<span>© <span id="year"></span> DARKI</span>
<a href="https://github.com/nur12islam/links" target="_blank" rel="noopener noreferrer">View source</a>
</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const LINKS=[
 {t:'StudySphere',d:'Your study companion for notes, files, productivity and learning.',u:'https://studysphere.darki.online',c:'Apps',i:'study',w:1,k:'education study notes library android'},
 {t:'DARKI Online',d:'The main site and front door to everything DARKI.',u:'https://darki.online',c:'Personal',i:'globe',k:'main website home identity'},
 {t:'DARKI Portfolio',d:'The person behind the projects, ideas and experiments.',u:'https://me.darki.online',c:'Personal',i:'user',k:'portfolio about creator profile'},
 {t:'xPDFs',d:'Helpful document utilities and web tools.',u:'https://helpers.darki.online',c:'Tools',i:'file',k:'pdf helpers utilities document'},
 {t:'Anime Stream',d:'An anime-focused streaming project.',u:'https://ent.darki.online',c:'Apps',i:'play',k:'anime stream entertainment'},
 {t:'M Solution',d:'Shop tools for products, orders and day-to-day business.',u:'https://shop.darki.online',c:'Business',i:'bag',k:'shop ecommerce orders management'},
 {t:'BXBC',d:'A digital space for Bharatpur Xerox & Book Centre.',u:'https://bxbc.darki.online',c:'Business',i:'book',w:1,k:'bharatpur xerox book centre stationery shop'}
];
const CATS=['All','Apps','Tools','Business','Personal'];
const ico=p=>'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const ICONS={
 study:ico('<path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/><path d="M22 10v6"/>'),
 globe:ico('<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20Z"/>'),
 user:ico('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>'),
 file:ico('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/>'),
 play:ico('<circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4Z"/>'),
 bag:ico('<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>'),
 book:ico('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>')
};
const ARROW='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';
const COPY='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const grid=$('grid'),q=$('q'),empty=$('empty'),toastEl=$('toast');
let cat='All';
grid.innerHTML=LINKS.map((l,n)=>`<article class="card${l.w?' wide':''}" style="--i:${n}" data-c="${l.c}" data-w="${l.w?1:0}" data-s="${esc((l.t+' '+l.d+' '+l.c+' '+l.u+' '+(l.k||'')).toLowerCase())}">
<div class="row"><span class="icon">${ICONS[l.i]}</span><div class="acts"><button class="copy" type="button" data-u="${esc(l.u)}" aria-label="Copy link to ${esc(l.t)}">${COPY}</button><span class="arr">${ARROW}</span></div></div>
<h3>${esc(l.t)}</h3><p class="desc">${esc(l.d)}</p>
<div class="meta"><span>${esc(new URL(l.u).host)}</span><span>${esc(l.c)}</span></div>
<a class="go" href="${esc(l.u)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${esc(l.t)}"></a></article>`).join('');
$('chips').innerHTML=CATS.map(c=>`<button class="chip" type="button" data-c="${c}" aria-pressed="${c==='All'}">${c}<small>${c==='All'?LINKS.length:LINKS.filter(l=>l.c===c).length}</small></button>`).join('');
const cards=[...grid.children],chips=[...document.querySelectorAll('.chip')];
function update(){
 const s=q.value.trim().toLowerCase(),plain=cat==='All'&&!s;let n=0;
 cards.forEach(c=>{
  const show=(cat==='All'||c.dataset.c===cat)&&(!s||c.dataset.s.includes(s));
  c.hidden=!show;if(show)n++;
  c.classList.toggle('wide',c.dataset.w==='1'&&plain);
 });
 empty.style.display=n?'none':'block';
}
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove('show'),1800)}
q.addEventListener('input',update);
q.addEventListener('keydown',e=>{
 if(e.key==='Escape'){q.value='';update();q.blur()}
 if(e.key==='Enter'){const a=cards.find(c=>!c.hidden)?.querySelector('.go');if(a)window.open(a.href,'_blank','noopener')}
});
$('chips').addEventListener('click',e=>{
 const b=e.target.closest('.chip');if(!b)return;
 cat=b.dataset.c;chips.forEach(x=>x.setAttribute('aria-pressed',x===b));update();
});
$('reset').addEventListener('click',()=>{q.value='';cat='All';chips.forEach(x=>x.setAttribute('aria-pressed',x.dataset.c==='All'));update();q.focus()});
$('hint').addEventListener('click',()=>q.focus());
addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();q.focus();q.select()}
 else if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}
});
grid.addEventListener('click',e=>{
 const b=e.target.closest('.copy');if(!b)return;
 (navigator.clipboard?navigator.clipboard.writeText(b.dataset.u):Promise.reject()).then(()=>toast('Link copied'),()=>toast('Copy failed. Open the link and copy it from the address bar.'));
});
if(matchMedia('(hover:hover) and (pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
 grid.addEventListener('pointermove',e=>{
  const c=e.target.closest('.card');if(!c)return;
  const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  c.style.setProperty('--ry',((x-.5)*7).toFixed(2)+'deg');c.style.setProperty('--rx',((.5-y)*7).toFixed(2)+'deg');
  c.style.setProperty('--mx',(x*100).toFixed(1)+'%');c.style.setProperty('--my',(y*100).toFixed(1)+'%');
 });
 grid.addEventListener('pointerout',e=>{
  const c=e.target.closest('.card');
  if(c&&!c.contains(e.relatedTarget)){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}
 });
}
$('year').textContent=new Date().getFullYear();
</script>
</body>
</html>
